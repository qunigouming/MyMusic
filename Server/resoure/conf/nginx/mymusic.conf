worker_processes 1;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }
    }
}

http {
    server {
        listen 80;
        server_name localhost;

        location /audio/ {
            types {
                application/vnd.apple.mpegurl m3u8;
                audio/mp4;
                audio/flac;
            }

            alias /home/main/music/;
            add_header Cache-Control "no-cache";
            add_header Access-Control-Allow-Origin "*";
        }

        location /group1/M00 {
            root /home/main/wangpan/storage/data;
            ngx_fastdfs_module;
        }
    }
}
